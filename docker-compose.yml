
services:
  postgres:
    image: postgres:16
    container_name: hospital_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospital_admin
      POSTGRES_PASSWORD: hospital_pass
      POSTGRES_DB: hospital_platform
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: